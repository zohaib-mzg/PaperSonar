# PaperSonar Phase 2 taxonomy contract (version 1).
# ---------------------------------------------------------------------------
# The authoritative seed lives in sql/04_categorization/01_seed_taxonomy.sql.
# tests/sql/test_config_contracts.py fails when this file and the SQL seed
# drift apart. Cortex is OFF by default; no category depends on it.
# ---------------------------------------------------------------------------

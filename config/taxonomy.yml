# PaperSonar Phase 3 taxonomy contract (version 2).
# ---------------------------------------------------------------------------
# The authoritative seed lives in sql/04_categorization/01_seed_taxonomy.sql.
# tests/sql/test_config_contracts.py fails when this file and the SQL seed
# drift apart. Cortex is OFF by default; no category depends on it.
#
# Version 2 (Phase 3 WP1) changes three things:
#   1. the category tree is widened from a software-engineering-only spine to
#      the eight broad research domains that the published corpus actually
#      contains, so that "topic" is a usable analytical dimension;
#   2. rules may match native source taxonomy values (field: keywords), which
#      is where OpenAlex topics, DataCite subjects, Crossref subjects, Zenodo
#      subjects and arXiv category codes arrive;
#   3. source_mappings pins native taxonomy values that must land on an exact
#      category (seeded into PROJECT_REF.REF_TAXONOMY_MAP).
# ---------------------------------------------------------------------------
